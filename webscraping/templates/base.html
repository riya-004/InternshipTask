<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Product Explorer{% endblock %}</title>
  <style>
    :root { --bg:#fffaf0; --ink:#1c1c1c; --accent:#d9822b; --card:#fff; --line:#eadfc9; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; gap:24px; align-items:center; }
    header h1 { font-size:1.15rem; margin:0; }
    header a { color:var(--ink); text-decoration:none; font-weight:600; }
    header a:hover { color:var(--accent); }
    main { max-width:1100px; margin:24px auto; padding:0 20px; }
    .notice { background:#fff3cd; border:1px solid #f0d98a; padding:14px 18px; border-radius:8px; }
    form.filters { display:flex; flex-wrap:wrap; gap:10px; align-items:end; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:18px; }
    form.filters label { display:flex; flex-direction:column; font-size:.78rem; color:#666; gap:3px; }
    input, select, button { font:inherit; padding:7px 10px; border:1px solid #ccc; border-radius:6px; }
    button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; font-weight:600; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:6px; }
    .card h3 { font-size:.98rem; margin:0; line-height:1.3; }
    .price { font-size:1.15rem; font-weight:700; color:var(--accent); }
    .stars { color:#f5a623; letter-spacing:2px; }
    .meta { font-size:.8rem; color:#666; }
    .desc { font-size:.85rem; color:#444; }
    .pager { display:flex; gap:12px; justify-content:center; margin:22px 0; align-items:center; }
    .pager a { color:var(--accent); font-weight:600; text-decoration:none; }
    .charts { display:grid; grid-template-columns:repeat(auto-fit, minmax(420px, 1fr)); gap:18px; }
    .charts img { width:100%; border:1px solid var(--line); border-radius:10px; background:#fff; }
  </style>
</head>
<body>
  <header>
    <h1>Product Explorer</h1>
    <a href="{{ url_for('index') }}">Products</a>
    <a href="{{ url_for('charts') }}">Charts</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
